name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bump (patch, minor, major, prerelease) or explicit version
        type: string
        required: true
        default: patch
      preid:
        description: Optional prerelease identifier (lowercase letters)
        type: string
      dist_tag:
        description: Optional npm dist-tag override
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: install
        uses: ./.github/actions/install
        with:
          node-version: "24"
      - id: version
        env:
          PACKAGE_MANAGER: ${{ steps.install.outputs.manager }}
          VERSION: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: '"$PACKAGE_MANAGER" run release:version'
      - id: prepare
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RETRY: ${{ steps.version.outputs.retry }}
        run: bash scripts/release/prepare.sh
      - if: steps.prepare.outputs.changed_ref == 'true'
        id: retry-install
        uses: ./.github/actions/install
        with:
          node-version: "24"
      - env:
          PACKAGE_MANAGER: ${{ steps.retry-install.outputs.manager || steps.install.outputs.manager }}
        run: bash scripts/check.sh
      - env:
          PACKAGE_MANAGER: ${{ steps.retry-install.outputs.manager || steps.install.outputs.manager }}
        run: '"$PACKAGE_MANAGER" run build'
      - if: steps.version.outputs.retry == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/release/push.sh
      - env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: bash scripts/release/publish.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: bash scripts/release/create-release.sh
