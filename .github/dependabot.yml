version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0-0"]
      - dependency-name: "@types/node"
        versions: [">=23.0.0-0"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/install"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
